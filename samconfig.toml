# Defaults for `sam build` and `sam deploy`, so the command in CI and the
# command a human runs locally are the same one.

version = 0.1

[default.global.parameters]
stack_name = "note-taking-prod"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "us-east-2"
# The stack creates its own execution role, which requires acknowledging IAM
# resource creation. No CAPABILITY_NAMED_IAM: nothing here names a role, so
# CloudFormation can replace them safely.
capabilities = "CAPABILITY_IAM"
# No resolve_s3: that would have SAM create its own managed bucket through a
# second CloudFormation stack, which the deploy role is not permitted to touch.
# The workflow passes --s3-bucket instead, pointing at the bucket the bootstrap
# stack created. The useful side effect is that a stray local `sam deploy`
# fails asking for a bucket rather than quietly shipping to production.
confirm_changeset = false
# A deploy with no changes is a successful no-op, not a failed pipeline.
fail_on_empty_changeset = false
parameter_overrides = "Stage=prod"
tags = "Application=note-taking Stage=prod"

[default.validate.parameters]
lint = true
